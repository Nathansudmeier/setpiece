        - paragraph [ref=e33]: Het idee
        - heading "Geen losse teamapp. Een clubplatform." [level=2] [ref=e34]
        - paragraph [ref=e35]: Nankaro is geen losse teamapp en ook geen klassiek ledenadministratiesysteem. Het is een digitaal clubplatform voor verenigingen die professioneler willen organiseren, ontwikkelen en communiceren zonder de menselijke clubcultuur kwijt te raken.
        - paragraph [ref=e36]: De kracht zit in de samenhang. Een proeftrainingaanvraag kan een taak, een scoutingdossier en uiteindelijk een spelerprofiel worden. Een wedstrijd levert input voor score, speelminuten, reflectie en content. De website is geen eiland, maar de publieke voorkant van dezelfde clubomgeving.
